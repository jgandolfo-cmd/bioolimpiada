// ── SM-2 REPASO ESPACIADO ─────────────────────────────────────
function sm2Update(tid, ok, meta){
  const h=S.historial[tid]||{ok:0,fail:0,facil:2.5,nextDate:null,lastDate:null};
  const hoy=new Date().toISOString().split("T")[0];
  if(ok){
    h.ok=(h.ok||0)+1;
    const bonus=meta==="completo"?0.1:meta==="parcial"?0:meta==="no"?-0.2:0;
    h.facil=Math.max(1.3,Math.min(2.8,(h.facil||2.5)+bonus));
    const dias=h.ok===1?1:h.ok===2?3:Math.round((h.ok-1)*h.facil);
    const prox=new Date();prox.setDate(prox.getDate()+Math.min(dias,21));
    h.nextDate=prox.toISOString().split("T")[0];
  } else {
    h.fail=(h.fail||0)+1;
    h.facil=Math.max(1.3,(h.facil||2.5)-0.3);
    const man=new Date();man.setDate(man.getDate()+1);
    h.nextDate=man.toISOString().split("T")[0];
  }
  h.lastDate=hoy;
  S.historial[tid]=h;
}

function temasParaRepasar(){
  const hoy=new Date().toISOString().split("T")[0];
  return Object.entries(S.historial)
    .filter(([,h])=>h.nextDate&&h.nextDate<=hoy)
    .map(([tid])=>tid);
}

function temasMasDebiles(n=5){
  return Object.entries(S.historial)
    .filter(([,h])=>(h.fail||0)>0)
    .sort(([,a],[,b])=>{
      const ra=(a.fail||0)/Math.max(1,(a.ok||0)+(a.fail||0));
      const rb=(b.fail||0)/Math.max(1,(b.ok||0)+(b.fail||0));
      return rb-ra;
    }).slice(0,n).map(([tid])=>tid);
}

// ── IA — PROXY SEGURO ─────────────────────────────────────────
// Cola simple para serializar llamadas a la IA y evitar 429
let _aiQueue=Promise.resolve();
function _delay(ms){return new Promise(r=>setTimeout(r,ms));}

async function ai(prompt, intentos=3){
  // Encadenar en cola: cada llamada espera que termine la anterior
  _aiQueue=_aiQueue.then(()=>_delay(300)); // 300ms entre llamadas
  await _aiQueue;

  for(let i=0;i<intentos;i++){
    try{
      const r=await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:[{role:"user",content:prompt}],max_tokens:1500})
      });
      if(r.status===429){
        // Rate limit: esperar más y reintentar
        const espera=4000*(i+1); // 4s, 8s, 12s
        console.warn(`Rate limit 429 — esperando ${espera/1000}s antes de reintentar (intento ${i+1}/${intentos})`);
        await _delay(espera);
        continue;
      }
      if(!r.ok){
        const e=await r.text();
        console.error("API error",r.status,":",e);
        throw new Error("Error "+r.status+": "+e.slice(0,200));
      }
      const d=await r.json();
      const txt=(d.content?.[0]?.text||"").trim();
      if(!txt) throw new Error("Respuesta vacía del servidor");
      return txt;
    }catch(e){
      if(i===intentos-1) throw e; // último intento: relanzar
      await _delay(2000);
    }
  }
  throw new Error("No se pudo conectar después de "+intentos+" intentos");
}

function parseJ(txt){
  // Gemini a veces envuelve en ```json ... ``` aunque se le pida que no
  let clean = txt.trim();
  // Quitar fences de código
  clean = clean.replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"").trim();
  // Quitar prefijos de texto antes del JSON
  const firstBrace = clean.indexOf("{");
  const firstBracket = clean.indexOf("[");
  const start = firstBrace>=0 && (firstBracket<0||firstBrace<=firstBracket) ? firstBrace : firstBracket;
  if(start>0) clean = clean.slice(start);
  // Quitar sufijos de texto después del JSON
  const lastBrace = clean.lastIndexOf("}");
  const lastBracket = clean.lastIndexOf("]");
  const end = Math.max(lastBrace, lastBracket);
  if(end>=0) clean = clean.slice(0, end+1);
  return JSON.parse(clean);
}

const PROMPT_MC=t=>`Sos profesor de Biología usando "Curtis: Biología" 7ma edición.
Generá UNA pregunta de OPCIÓN MÚLTIPLE sobre: "${t.nom}" (Unidad: ${t.unom}, Cap. ${t.cap}).
Nivel: secundaria OAB intercolegial argentino.
- 4 opciones (A, B, C, D), exactamente UNA correcta
- Distractores con errores conceptuales reales y plausibles
- Requiere comprensión profunda, no memorización
Respondé SOLO con JSON válido sin markdown:
{"tipo":"mc","titulo":"título corto","enunc":"enunciado completo","ops":["A) ...","B) ...","C) ...","D) ..."],"ok":2,"conc":"concepto clave","expl":"por qué esa opción es correcta"}
IMPORTANTE: "ok" es el ÍNDICE NUMÉRICO (0,1,2 o 3) de la opción correcta.`;

const PROMPT_OPEN=t=>`Sos profesor de Biología usando "Curtis: Biología" 7ma edición.
Generá UNA pregunta de RESPUESTA ABIERTA sobre: "${t.nom}" (Cap. ${t.cap}).
Nivel: secundaria OAB intercolegial. Requiere razonamiento y justificación.
Respondé SOLO con JSON válido sin markdown:
{"tipo":"open","titulo":"título corto","enunc":"enunciado completo","resp":"respuesta modelo que daría un buen alumno","kw":["término1","término2","término3","término4"],"conc":"concepto clave","expl":"explicación didáctica"}
IMPORTANTE: "kw" son 4-5 términos técnicos específicos que DEBEN aparecer en una buena respuesta.`;

const PROMPT_VF=t=>`Sos profesor de Biología usando "Curtis: Biología" 7ma edición.
Generá UNA pregunta de VERDADERO O FALSO sobre: "${t.nom}" (Cap. ${t.cap}).
REGLA CRÍTICA: "enunc" DEBE SER una afirmación declarativa factual, NUNCA una pregunta.
✅ CORRECTO: "La membrana plasmática es selectivamente permeable."
❌ PROHIBIDO: "¿Qué es...?", "Definí...", "Explicá..."
Respondé SOLO con JSON válido sin markdown:
{"tipo":"vf","titulo":"título corto","enunc":"AFIRMACIÓN declarativa","verd":true,"conc":"concepto clave","expl":"por qué es verdadero o falso según Curtis","kw":["término1","término2","término3"]}
IMPORTANTE: "verd" es booleano true o false (sin comillas).`;

function validarQ(q,tipo){
  if(!q?.enunc||q.enunc.length<20)return false;
  if(tipo==="mc"){const ok=parseInt(q.ok);return Array.isArray(q.ops)&&q.ops.length===4&&ok>=0&&ok<=3&&!!q.expl;}
  if(tipo==="open"){return q.resp?.length>30&&Array.isArray(q.kw)&&q.kw.length>=3;}
  if(tipo==="vf"){
    const e=(q.enunc||"").trim();
    if(e.includes("?"))return false;
    if(/^(define|definí|explicá|describí|indicá|enumerá|mencioná)/i.test(e))return false;
    return typeof q.verd==="boolean"&&!!q.expl;
  }
  return false;
}

async function genQ(tema,tipo,intento=1){
  const ps={mc:PROMPT_MC,open:PROMPT_OPEN,vf:PROMPT_VF};
  try{
    const txt=await ai(ps[tipo](tema));
    const q=parseJ(txt);
    if(tipo==="mc")q.ok=parseInt(q.ok);
    if(tipo==="vf")q.verd=(q.verd===true||q.verd==="true");
    q.tmNom=tema.nom;q.tmCap=tema.cap;q.tmUnom=tema.unom;q.ucol=tema.ucol;q.tid=tema.id;
    if(validarQ(q,tipo))return q;
    if(intento<2)return genQ(tema,tipo==="vf"?"open":tipo,intento+1);
    return genQ(tema,"open",3);
  }catch(e){
    if(intento<2)return genQ(tema,"open",intento+1);
    return{tipo:"open",titulo:"Comprensión",
      enunc:`Explicá el concepto "${tema.nom}" y su función según Curtis cap. ${tema.cap}.`,
      resp:`${tema.nom} según Curtis cap. ${tema.cap}.`,
      kw:[tema.nom.split(" ")[0],"función","estructura","célula"],
      conc:tema.nom,expl:`Ver Curtis 7ma ed., cap. ${tema.cap}.`,
      tmNom:tema.nom,tmCap:tema.cap,tmUnom:tema.unom,ucol:tema.ucol,tid:tema.id};
  }
}

// ── EVALUACIÓN ────────────────────────────────────────────────
function evalMC(q,sel){return parseInt(sel)===parseInt(q.ok);}
function evalVF(q,vfs){return(q.verd===true)===(vfs===true);}
// ── EVALUACIÓN FLEXIBLE ───────────────────────────────────────
// Normaliza texto: minúsculas, sin tildes, sin puntuación extra
function norm(s){
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // quitar tildes
    .replace(/[^a-z0-9\s]/g," ")                     // quitar puntuación
    .replace(/\s+/g," ").trim();
}

// Raíz simple: saca plurales y terminaciones comunes
function raiz(w){
  w=norm(w);
  // Plural es → singular
  if(w.endsWith("es")&&w.length>4)w=w.slice(0,-2);
  else if(w.endsWith("s")&&w.length>3)w=w.slice(0,-1);
  // Terminaciones verbales/adjetivos comunes
  if(w.endsWith("cion"))w=w.slice(0,-4);
  if(w.endsWith("cion"))w=w.slice(0,-3);
  if(w.endsWith("ado")||w.endsWith("ada"))w=w.slice(0,-3);
  if(w.endsWith("ando")||w.endsWith("endo"))w=w.slice(0,-4);
  return w.length>3?w:w; // devolver igual si muy corta
}

function matchKW(keyword, textoNorm){
  const kn=norm(keyword);
  // 1. Match exacto normalizado
  if(textoNorm.includes(kn))return true;
  // 2. Match por raíz (cubre plurales, conjugaciones)
  const kr=raiz(kn);
  if(kr.length>3&&textoNorm.includes(kr))return true;
  // 3. Match por primera palabra del keyword (ej: "bomba Na/K" → "bomba")
  const primera=kn.split(" ")[0];
  if(primera.length>4&&textoNorm.includes(primera))return true;
  return false;
}

function evalKW(q,txt){
  if(!q.kw?.length)return null;
  const tn=norm(txt);
  const m=q.kw.filter(k=>matchKW(k,tn));
  return m.length/q.kw.length;
}

async function evalOpenAI(q,txt){
  const p=`Sos un evaluador generoso para estudiantes de biología de secundaria argentina.
Tu trabajo: decidir si la respuesta del alumno demuestra comprensión del concepto, aunque use otras palabras.

CONCEPTO EVALUADO: "${q.conc}"
RESPUESTA MODELO (referencia): "${q.resp||q.expl}"
RESPUESTA DEL ALUMNO: "${txt}"

CRITERIOS — marcá ok:true si el alumno:
- Captura la idea central aunque sea con sus propias palabras
- Usa sinónimos o reformulaciones válidas
- Tiene la dirección correcta aunque le falten detalles menores
- Comete errores menores de terminología pero entiende el concepto

Marcá ok:false SOLO si:
- La respuesta es completamente incorrecta o contradice el concepto
- Muestra confusión conceptual clara (no solo imprecisión de vocabulario)
- Es demasiado vaga para evaluar ("no sé", "algo relacionado con células", etc.)

JSON SOLO sin markdown: {"ok":true} o {"ok":false}`;
  try{
    const r=parseJ(await ai(p));
    return r.ok===true;
  }catch{
    // Si falla el parse, dar el beneficio de la duda si la respuesta es larga
    return txt.trim().length>80;
  }
}

async function evalOpen(q,txt){
  const cov=evalKW(q,txt);
  // Con matching flexible: ≥40% de keywords ya es correcto
  if(cov!==null&&cov>=0.4)return true;
  // Respuesta muy corta sin keywords → incorrecto sin llamar a IA
  if(txt.trim().length<20)return false;
  // Para el resto: la IA decide con criterio generoso
  return await evalOpenAI(q,txt);
}

// ── SOCRÁTICO ─────────────────────────────────────────────────
async function socr(q,hist,ronda){
  const ul=ronda>=3;
  const ht=hist.map(h=>`${h.r==="a"?"ALUMNO":"TUTOR"}: "${h.t}"`).join("\n");
  const p=`Tutor socrático OAB (Curtis 7ma ed.).
Tema: "${q.tmNom}" — Concepto: "${q.conc}"
${ht}
${!ul?`RONDA ${ronda}/3:
- NUNCA digas "incorrecto" ni reveles la respuesta
- Reconocé algo positivo y hacé UNA pregunta guía
- Ronda 1: exploración amplia | Ronda 2: mencioná "${q.conc}" | Ronda 3: muy directa
- Español rioplatense, max 2 oraciones + pregunta`
:`ÚLTIMA — revelá: "${q.resp||q.expl}"
Empezá con "Muy bien por el esfuerzo —". Max 4 oraciones didácticas.`}
JSON: {"t":"...","rev":${ul}}`;
  try{const r=parseJ(await ai(p));return{t:String(r.t||""),rev:!!r.rev};}
  catch{return{t:ul?`Muy bien por el esfuerzo — ${q.expl}`:"¿Podés ampliar tu razonamiento?",rev:ul};}
}

async function explicarSimple(){
  if(!explicameTxt.trim())return;
  explicameLoad=true;render();
  try{
    const txt=await ai(`Explicá "${explicameTxt}" en biología como si fuera para un alumno de 15 años de secundaria argentina. Usá una analogía con algo cotidiano. Máximo 4 oraciones. Sin tecnicismos innecesarios. Español rioplatense informal.`);
    explicameRes=txt;
  }catch(e){
    explicameRes="No pude generar la explicación. Revisá tu conexión.";
  }
  explicameLoad=false;render();
}

// ── CONEXIONES ENTRE CONCEPTOS ───────────────────────────────
async function mostrarConexiones(q){
  // Esperar 2s antes de pedir conexiones para no competir con evaluación
  await new Promise(r=>setTimeout(r,2000));
  try{
    const txt=await ai(`Dado el concepto "${q.tmNom}" de Curtis Biología cap. ${q.tmCap}, listá exactamente 3 conceptos del mismo libro directamente relacionados. Solo los nombres separados por coma, sin explicación. Ej: "Fotosíntesis, Cloroplasto, ATP"`);
    S.ses.conexiones=txt.split(",").map(s=>s.trim()).filter(Boolean).slice(0,3);
  }catch(e){
    S.ses.conexiones=[]; // falló silenciosamente — no es crítico
  }
  render();
}

  document.getElementById("binic")?.addEventListener("click",iniciar);
  document.querySelectorAll("[data-mc]").forEach(el=>el.addEventListener("click",()=>{S.ses.act.sel=parseInt(el.dataset.mc);render();}));
  document.querySelectorAll("[data-vfs]").forEach(el=>el.addEventListener("click",()=>{S.ses.act.vfs=(el.dataset.vfs==="true");S.ses.act.txt="";render();setTimeout(()=>document.getElementById("tvf")?.focus(),80);}));
  const tvf=document.getElementById("tvf");
  if(tvf){tvf.addEventListener("input",e=>{S.ses.act.txt=e.target.value;render();});tvf.focus();}
  const to=document.getElementById("topen");
  if(to){to.addEventListener("input",e=>{S.ses.act.txt=e.target.value;const bt=document.getElementById("benv");if(bt)bt.disabled=S.ses.act.txt.trim().length<20;const cc=document.getElementById("cc");if(cc){cc.textContent=S.ses.act.txt.trim().length<20?`Mínimo 20 caracteres`:`${S.ses.act.txt.length} ✓`;cc.style.color=S.ses.act.txt.trim().length<20?"#ef4444":"#475569";}});to.focus();}
  document.getElementById("benv")?.addEventListener("click",enviar);
  document.getElementById("brsp")?.addEventListener("click",respDlg);
  document.getElementById("bnxt")?.addEventListener("click",siguiente);
  // Metacognición — botones de autoevaluación
  document.getElementById("bmeta-ok")?.addEventListener("click",()=>{
    const xpNuevo=parseInt(document.getElementById("bmeta-ok")?.dataset.xp||"40");
    const r=S.ses.res[S.ses.res.length-1];
    if(r){
      const diff=xpNuevo-(r.xp||0); // diferencia respecto al XP ya sumado
      S.xp+=diff; r.xp=xpNuevo; r.meta="completo";
      // Actualizar SM-2 con metacognición
      const q=S.ses.pregs[S.ses.idx];
      if(q?.tid) sm2Update(q.tid, true, "completo");
    }
    saveLocal();siguiente();
  });
  document.getElementById("bmeta-parcial")?.addEventListener("click",()=>{
    const xpNuevo=parseInt(document.getElementById("bmeta-parcial")?.dataset.xp||"24");
    const r=S.ses.res[S.ses.res.length-1];
    if(r){
      const diff=xpNuevo-(r.xp||0);
      S.xp+=diff; r.xp=xpNuevo; r.meta="parcial";
      const q=S.ses.pregs[S.ses.idx];
      if(q?.tid) sm2Update(q.tid, true, "parcial");
      // Agregar al diario: entendió pero le faltó algo
      if(q) S.errores.push({
        fecha:new Date().toISOString().split("T")[0],
        tema:q.tmNom, cap:q.tmCap||"",
        pregunta:q.enunc?.substring(0,120)||"",
        respCorrecta:q.tipo==="mc"?(q.ops?.[q.ok]||"").replace(/^[A-D]\)\s*/,""):q.resp||q.expl||"",
        meta:"parcial"
      });
    }
    saveLocal();siguiente();
  });
  document.getElementById("bmeta-no")?.addEventListener("click",()=>{
    const r=S.ses.res[S.ses.res.length-1];
    if(r){
      const diff=5-(r.xp||0);
      S.xp+=diff; r.xp=5; r.meta="no";
      const q=S.ses.pregs[S.ses.idx];
      if(q?.tid) sm2Update(q.tid, false, "no");
      // Agregar al diario
      if(q) S.errores.push({
        fecha:new Date().toISOString().split("T")[0],
        tema:q.tmNom, cap:q.tmCap||"",
        pregunta:q.enunc?.substring(0,120)||"",
        respCorrecta:q.tipo==="mc"?(q.ops?.[q.ok]||"").replace(/^[A-D]\)\s*/,""):q.resp||q.expl||"",
        meta:"no"
      });
    }
    saveLocal();siguiente();
  });
  document.getElementById("bvosel")?.addEventListener("click",()=>{S.pan="sel";render();});
  document.getElementById("bnueva")?.addEventListener("click",iniciar);
  // Nav inferior
  document.getElementById("bnav-home")?.addEventListener("click",()=>{S.pan="home";render();});
  document.getElementById("bnav-mapa")?.addEventListener("click",()=>{S.mapaUnit=null;S.pan="mapa";render();});
  document.getElementById("bnav-buscar")?.addEventListener("click",()=>{S.pan="buscar";render();setTimeout(()=>document.getElementById("ibusq")?.focus(),80);});
  document.getElementById("bdiario")?.addEventListener("click",()=>{S.pan="diario";render();});
  document.getElementById("blimpiar-diario")?.addEventListener("click",()=>{
    if(confirm("¿Limpiar todos los errores del diario?")){S.errores=[];saveLocal();render();}
  });
  // Explicame simple
  document.getElementById("bexplicame")?.addEventListener("click",()=>{
    explicameActivo=!explicameActivo;if(!explicameActivo)explicameRes="";render();
    setTimeout(()=>document.getElementById("iexplicame")?.focus(),80);
  });
  document.getElementById("bexplicame-cerrar")?.addEventListener("click",()=>{explicameActivo=false;explicameRes="";render();});
  const iexp=document.getElementById("iexplicame");
  if(iexp){
    iexp.addEventListener("input",e=>{explicameTxt=e.target.value;});
    iexp.addEventListener("keydown",e=>{if(e.key==="Enter")explicarSimple();});
    iexp.focus();
  }
  document.getElementById("bexplicame-buscar")?.addEventListener("click",explicarSimple);
  // Conexiones — ir al buscador
  document.querySelectorAll("[data-busq]").forEach(el=>el.addEventListener("click",()=>{
    S.busqTxt=el.dataset.busq;S.busqRes=null;S.pan="buscar";render();
    setTimeout(()=>buscar(),100);
  }));
  // Mapa general — clic en unidad
  document.querySelectorAll("[data-munit]").forEach(el=>el.addEventListener("click",()=>{S.mapaUnit=el.dataset.munit;render();}));
  // Mapa detalle — toggle tema
  document.querySelectorAll("[data-toggle]").forEach(el=>el.addEventListener("click",e=>{
    e.stopPropagation();const id=el.dataset.toggle;
    S.sel.has(id)?S.sel.delete(id):S.sel.add(id);saveLocal();render();
  }));
  // Buscador
  const ibusq=document.getElementById("ibusq");
  if(ibusq){
    ibusq.addEventListener("input",e=>{S.busqTxt=e.target.value;});
    ibusq.addEventListener("keydown",e=>{if(e.key==="Enter")buscar();});
    ibusq.focus();
    // Mostrar el valor guardado si volvió a la pantalla
    if(S.busqTxt) ibusq.value=S.busqTxt;
  }
  document.getElementById("bbuscar")?.addEventListener("click",buscar);
  document.querySelectorAll("[data-sug]").forEach(el=>el.addEventListener("click",()=>{
    S.busqTxt=el.dataset.sug;buscar();
  }));
  // Practicar tema desde buscador
  document.getElementById("bpracticar")?.addEventListener("click",e=>{
    const tid=e.currentTarget.dataset.tid;
    if(tid){S.sel.add(tid);saveLocal();S.pan="home";render();}
  });
}

// ── LÓGICA ────────────────────────────────────────────────────
function tryPin(){
  if(S.pin===PIN){
    S.pinErr=false;
    // Si ya tiene DNI guardado, ir directo al paso 2
    S.loginStep=2;render();
    setTimeout(()=>document.getElementById("idni")?.focus(),100);
  }else{S.pinErr=true;render();}
}

function tryLogin(){
  const dni=document.getElementById("idni")?.value?.trim()||"";
  const clave=document.getElementById("iclave")?.value?.trim()||"";
  if(!dni||dni.length<6){S.claveErr=true;render();return;}
  if(clave!==CLAVE_ALUMNO){S.claveErr=true;render();return;}
  S.dni=dni;S.nombre=dni;S.clave=clave;S.claveErr=false;
  S.pan="home";saveLocal();render();
}

async function iniciar(modo="normal"){
  S.showCfg=false;
  const modo_actual=modo||"normal";
  S.ses.modo=modo_actual;

  let temasIds;
  if(modo_actual==="repaso"){
    // Solo temas pendientes de repasar hoy
    temasIds=temasParaRepasar();
    if(!temasIds.length){alert("No tenés temas para repasar hoy. ¡Volvé mañana!");return;}
  } else if(modo_actual==="simulacro"){
    // Todos los temas seleccionados
    temasIds=[...S.sel];
    if(!temasIds.length){alert("Seleccioná temas primero.");return;}
  } else {
    // Normal: mezcla de temas débiles + seleccionados
    const debiles=temasMasDebiles(3).filter(t=>S.sel.has(t));
    const selArr=[...S.sel];
    // 40% temas débiles si los hay, 60% normal
    temasIds=debiles.length?[...debiles,...selArr].slice(0,selArr.length):selArr;
    if(!temasIds.length)return;
  }

  const temas=temasIds.map(id=>tById(id)).filter(Boolean);
  if(!temas.length)return;
  const tipos=modo_actual==="simulacro"?["mc"]:S.cfg.tipos.length?S.cfg.tipos:["mc"];
  const nPregs=modo_actual==="simulacro"?20:S.cfg.n;
  const plan=[];
  for(let i=0;i<nPregs;i++)plan.push({tema:temas[i%temas.length],tipo:tipos[i%tipos.length]});
  for(let i=plan.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[plan[i],plan[j]]=[plan[j],plan[i]];}
  S.ses={plan,pregs:Array(nPregs).fill(null),idx:0,act:{fase:"cargando",ronda:0,hist:[],load:false,sel:null,txt:"",vfs:null},res:[],modo:modo_actual};
  S.pan="ses";render();
  const q=await genQ(plan[0].tema,plan[0].tipo);
  S.ses.pregs[0]=q;S.ses.act.fase="res";render();
  if(plan.length>1)genQ(plan[1].tema,plan[1].tipo).then(q2=>{S.ses.pregs[1]=q2;});
}

async function enviar(){
  const ac=S.ses.act,q=S.ses.pregs[S.ses.idx];if(!q)return;
  const esSimulacro=S.ses.modo==="simulacro";
  if(q.tipo==="mc"){
    if(evalMC(q,ac.sel)){fin(q,true,esSimulacro?30:40);return;}
    if(esSimulacro){fin(q,false,0);return;} // simulacro: sin socrático
    ac.ronda++;ac.hist.push({r:"a",t:`Elegí: "${(q.ops[ac.sel]||"").replace(/^[A-D]\)\s*/,"").substring(0,60)}"`});
    ac.fase="dlg";ac.load=true;render();
    const rs=await socr(q,ac.hist,ac.ronda);
    ac.load=false;ac.hist.push({r:"t",t:rs.t});
    if(rs.rev)fin(q,false,8);render();return;
  }
  if(q.tipo==="vf"){
    if(evalVF(q,ac.vfs)){fin(q,true,35);return;}
    if(esSimulacro){fin(q,false,0);return;}
    ac.ronda++;ac.hist.push({r:"a",t:`${ac.vfs?"Verdadero":"Falso"} — ${ac.txt.substring(0,60)}`});
    ac.fase="dlg";ac.load=true;render();
    const rs=await socr(q,ac.hist,ac.ronda);
    ac.load=false;ac.hist.push({r:"t",t:rs.t});
    if(rs.rev)fin(q,false,8);render();return;
  }
  if(q.tipo==="open"){
    ac.load=true;render();
    const ok=await evalOpen(q,ac.txt);
    if(ok){fin(q,true,50);return;}
    if(esSimulacro){fin(q,false,0);return;}
    ac.ronda++;ac.hist.push({r:"a",t:ac.txt.substring(0,120)});
    ac.fase="dlg";ac.load=true;render();
    const rs=await socr(q,ac.hist,ac.ronda);
    ac.load=false;ac.hist.push({r:"t",t:rs.t});
    if(rs.rev)fin(q,false,8);render();
  }
}

async function respDlg(){
  const td=document.getElementById("tdlg");if(!td||!td.value.trim())return;
  const ac=S.ses.act,q=S.ses.pregs[S.ses.idx],resp=td.value.trim();
  ac.hist.push({r:"a",t:resp});ac.load=true;render();
  let ok=false;
  if(q.tipo==="open")ok=await evalOpen(q,resp);
  else ok=await evalOpenAI({conc:q.conc,resp:q.expl},resp);
  if(ok){fin(q,true,Math.round((q.tipo==="open"?50:40)*0.72));return;}
  ac.ronda++;
  if(ac.ronda>3){fin(q,false,8);return;}
  const rs=await socr(q,ac.hist,ac.ronda);
  ac.load=false;ac.hist.push({r:"t",t:rs.t});
  if(rs.rev)fin(q,false,8);render();
}

function fin(q,ok,xp,meta){
  const xpFinal=ok?xp:8;
  S.ses.res.push({ok,xp:xpFinal,tema:q.tmNom,tipo:q.tipo,
    meta:meta||"",rondas:S.ses.act.ronda,tid:q.tid||""});
  S.ses.act.fase=ok?"ok":"rev";
  S.xp+=xpFinal;
  S.ses.conexiones=[];
  // Actualizar SM-2
  if(q.tid) sm2Update(q.tid, ok, meta||"");
  // Cargar conexiones en background si fue correcto
  if(ok&&S.ses.modo!=="simulacro") mostrarConexiones(q);
  // Guardar error en diario si no fue correcto o metacognición negativa
  if(!ok||(ok&&meta==="no")){
    S.errores.push({
      fecha:new Date().toISOString().split("T")[0],
      tema:q.tmNom, cap:q.tmCap||"",
      pregunta:q.enunc?.substring(0,120)||"",
      respCorrecta:q.tipo==="mc"?(q.ops?.[q.ok]||"").replace(/^[A-D]\)\s*/,""):q.resp||q.expl||"",
      meta:meta||""
    });
  }
  saveLocal();render();
}

async function siguiente(){
  const ni=S.ses.idx+1;
  const total=S.ses.plan.length; // usar largo real del plan (no S.cfg.n)
  if(ni>=total){
    S.sesiones++;S.racha++;saveLocal();
    guardarEnSheets(S.ses.res);
    S.pan="fin";render();return;
  }
  S.ses.idx=ni;S.ses.act={fase:"cargando",ronda:0,hist:[],load:false,sel:null,txt:"",vfs:null};render();
  if(!S.ses.pregs[ni]){const p=S.ses.plan[ni];S.ses.pregs[ni]=await genQ(p.tema,p.tipo);}
  S.ses.act.fase="res";S.ses.conexiones=[];render();
  if(ni+1<total&&!S.ses.pregs[ni+1])genQ(S.ses.plan[ni+1].tema,S.ses.plan[ni+1].tipo).then(q=>{S.ses.pregs[ni+1]=q;});
}

// ── BUSCADOR ─────────────────────────────────────────────────
// Normaliza texto: minúsculas + sin tildes
function sinAcentos(s){
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
}

async function buscar(){
  if(!S.busqTxt.trim())return;
  S.busqLoad=true;S.busqRes=null;render();

  // Buscar tema relacionado ignorando acentos y mayúsculas
  const termN=sinAcentos(S.busqTxt);
  let temaMatch=null;
  for(const u of UNITS){
    for(const t of u.temas){
      const nomN=sinAcentos(t.nom);
      const nomBase=sinAcentos(t.nom.split(":")[0]);
      if(nomN.includes(termN)||termN.includes(nomBase)||sinAcentos(t.nom.split(" ")[0]).startsWith(termN.split(" ")[0])){
        temaMatch={...t,ucol:u.col,unom:u.nom};break;
      }
    }
    if(temaMatch)break;
  }

  const prompt=`Sos un experto en el libro "Curtis: Biología" 7ma edición en español.
El alumno busca el concepto: "${S.busqTxt}"

Respondé con un JSON con esta estructura exacta (sin markdown, sin backticks):
{
  "icono": "emoji representativo del concepto",
  "capitulo": "número o rango de capítulo donde aparece principalmente",
  "paginas": "rango de páginas aproximado (ej: 145-152)",
  "resumen": "explicación clara del concepto en 3-4 oraciones, nivel secundaria",
  "relacionados": ["concepto1", "concepto2", "concepto3"],
  "tema_id": "${temaMatch?temaMatch.id:""}"
}

Si el concepto no está en Curtis 7ma ed., igualmente dá la mejor información que tengas sobre el tema a nivel biología secundaria, indicando en "capitulo" el capítulo más cercano.`;

  try{
    const txt=await ai(prompt);
    const res=parseJ(txt);
    // Si la IA no devolvió tema_id pero hay match local, usarlo
    if(!res.tema_id&&temaMatch)res.tema_id=temaMatch.id;
    S.busqRes=res;
  }catch(e){
    console.error("Error buscador:",e);
    // Intentar dar una respuesta básica desde el conocimiento del sistema
    // basada en el match local si existe
    if(temaMatch){
      S.busqRes={
        icono:"📖",
        capitulo:temaMatch.cap||"—",
        paginas:"Ver Curtis cap. "+temaMatch.cap,
        resumen:`${temaMatch.nom} es un tema de ${temaMatch.unom} tratado en Curtis cap. ${temaMatch.cap}. La IA no pudo generar un resumen en este momento. Revisá tu conexión o intentá de nuevo.`,
        relacionados:[],
        tema_id:temaMatch.id
      };
    } else {
      S.busqRes={
        icono:"⚠️",
        capitulo:"—",
        paginas:"—",
        resumen:`Error al conectar con el servidor (${e.message||"sin conexión"}). Revisá tu conexión a internet e intentá de nuevo.`,
        relacionados:[],
        tema_id:""
      };
    }
  }
  S.busqLoad=false;render();
}
