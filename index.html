// ── IA — PROXY SEGURO ─────────────────────────────────────────
async function ai(prompt){
  const r=await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      messages:[{role:"user",content:prompt}],
      max_tokens:1500
    })
  });
  if(!r.ok){const e=await r.text();throw new Error(e);}
  const d=await r.json();
  return(d.content?.[0]?.text||"").trim();
}

function parseJ(txt){
  return JSON.parse(txt.replace(/```json|```/g,"").trim());
}

// ── PROMPTS DE GENERACIÓN ────────────────────────────────────
const PROMPT_MC=t=>`Sos profesor de Biología usando "Curtis: Biología" 7ma edición.
Generá UNA pregunta de OPCIÓN MÚLTIPLE sobre: "${t.nom}" (Unidad: ${t.unom}, Cap. ${t.cap}).
Nivel: secundaria OAB intercolegial argentino.
- 4 opciones (A, B, C, D), exactamente UNA correcta
- Distractores con errores conceptuales reales y plausibles
- Requiere comprensión profunda, no memorización
Respondé SOLO con JSON válido sin markdown:
{"tipo":"mc","titulo":"título corto","enunc":"enunciado completo","ops":["A) ...","B) ...","C) ...","D) ..."],"ok":2,"conc":"concepto clave","expl":"por qué esa opción es correcta"}
IMPORTANTE: "ok" es el ÍNDICE NUMÉRICO (0,1,2 o 3) de la opción correcta.`;

const PROMPT_OPEN=t=>`Sos profesor de Biología usando "Curtis: Biología" 7ma edición.
Generá UNA pregunta de RESPUESTA ABIERTA sobre: "${t.nom}" (Cap. ${t.cap}).
Nivel: secundaria OAB intercolegial. Requiere razonamiento y justificación.
Respondé SOLO con JSON válido sin markdown:
{"tipo":"open","titulo":"título corto","enunc":"enunciado completo","resp":"respuesta modelo que daría un buen alumno","kw":["término1","término2","término3","término4"],"conc":"concepto clave","expl":"explicación didáctica"}
IMPORTANTE: "kw" son 4-5 términos técnicos específicos que DEBEN aparecer en una buena respuesta.`;

const PROMPT_VF=t=>`Sos profesor de Biología usando "Curtis: Biología" 7ma edición.
Generá UNA pregunta de VERDADERO O FALSO sobre: "${t.nom}" (Cap. ${t.cap}).
REGLA CRÍTICA: "enunc" DEBE SER una afirmación declarativa factual, NUNCA una pregunta.
✅ CORRECTO: "La membrana plasmática es selectivamente permeable."
❌ PROHIBIDO: "¿Qué es...?", "Definí...", "Explicá..."
Respondé SOLO con JSON válido sin markdown:
{"tipo":"vf","titulo":"título corto","enunc":"AFIRMACIÓN declarativa","verd":true,"conc":"concepto clave","expl":"por qué es verdadero o falso según Curtis","kw":["término1","término2","término3"]}
IMPORTANTE: "verd" es booleano true o false (sin comillas).`;

function validarQ(q,tipo){
  if(!q?.enunc||q.enunc.length<20)return false;
  if(tipo==="mc"){const ok=parseInt(q.ok);return Array.isArray(q.ops)&&q.ops.length===4&&ok>=0&&ok<=3&&!!q.expl;}
  if(tipo==="open"){return q.resp?.length>30&&Array.isArray(q.kw)&&q.kw.length>=3;}
  if(tipo==="vf"){
    const e=(q.enunc||"").trim();
    if(e.includes("?"))return false;
    if(/^(define|definí|explicá|describí|indicá|enumerá|mencioná)/i.test(e))return false;
    return typeof q.verd==="boolean"&&!!q.expl;
  }
  return false;
}

async function genQ(tema,tipo,intento=1){
  const ps={mc:PROMPT_MC,open:PROMPT_OPEN,vf:PROMPT_VF};
  try{
    const txt=await ai(ps[tipo](tema));
    const q=parseJ(txt);
    if(tipo==="mc")q.ok=parseInt(q.ok);
    if(tipo==="vf")q.verd=(q.verd===true||q.verd==="true");
    q.tmNom=tema.nom;q.tmCap=tema.cap;q.tmUnom=tema.unom;q.ucol=tema.ucol;q.tid=tema.id;
    if(validarQ(q,tipo))return q;
    if(intento<2)return genQ(tema,tipo==="vf"?"open":tipo,intento+1);
    return genQ(tema,"open",3);
  }catch(e){
    if(intento<2)return genQ(tema,"open",intento+1);
    return{tipo:"open",titulo:"Comprensión",
      enunc:`Explicá el concepto "${tema.nom}" y su función según Curtis cap. ${tema.cap}.`,
      resp:`${tema.nom} según Curtis cap. ${tema.cap}.`,
      kw:[tema.nom.split(" ")[0],"función","estructura","célula"],
      conc:tema.nom,expl:`Ver Curtis 7ma ed., cap. ${tema.cap}.`,
      tmNom:tema.nom,tmCap:tema.cap,tmUnom:tema.unom,ucol:tema.ucol,tid:tema.id};
  }
}

// ── EVALUACIÓN ────────────────────────────────────────────────
function evalMC(q,sel){return parseInt(sel)===parseInt(q.ok);}
function evalVF(q,vfs){return(q.verd===true)===(vfs===true);}
// ── EVALUACIÓN FLEXIBLE ───────────────────────────────────────
// Normaliza texto: minúsculas, sin tildes, sin puntuación extra
function norm(s){
  return s.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // quitar tildes
    .replace(/[^a-z0-9\s]/g," ")                     // quitar puntuación
    .replace(/\s+/g," ").trim();
}

// Raíz simple: saca plurales y terminaciones comunes
function raiz(w){
  w=norm(w);
  // Plural es → singular
  if(w.endsWith("es")&&w.length>4)w=w.slice(0,-2);
  else if(w.endsWith("s")&&w.length>3)w=w.slice(0,-1);
  // Terminaciones verbales/adjetivos comunes
  if(w.endsWith("cion"))w=w.slice(0,-4);
  if(w.endsWith("cion"))w=w.slice(0,-3);
  if(w.endsWith("ado")||w.endsWith("ada"))w=w.slice(0,-3);
  if(w.endsWith("ando")||w.endsWith("endo"))w=w.slice(0,-4);
  return w.length>3?w:w; // devolver igual si muy corta
}

function matchKW(keyword, textoNorm){
  const kn=norm(keyword);
  // 1. Match exacto normalizado
  if(textoNorm.includes(kn))return true;
  // 2. Match por raíz (cubre plurales, conjugaciones)
  const kr=raiz(kn);
  if(kr.length>3&&textoNorm.includes(kr))return true;
  // 3. Match por primera palabra del keyword (ej: "bomba Na/K" → "bomba")
  const primera=kn.split(" ")[0];
  if(primera.length>4&&textoNorm.includes(primera))return true;
  return false;
}

function evalKW(q,txt){
  if(!q.kw?.length)return null;
  const tn=norm(txt);
  const m=q.kw.filter(k=>matchKW(k,tn));
  return m.length/q.kw.length;
}

async function evalOpenAI(q,txt){
  const p=`Sos un evaluador generoso para estudiantes de biología de secundaria argentina.
Tu trabajo: decidir si la respuesta del alumno demuestra comprensión del concepto, aunque use otras palabras.

CONCEPTO EVALUADO: "${q.conc}"
RESPUESTA MODELO (referencia): "${q.resp||q.expl}"
RESPUESTA DEL ALUMNO: "${txt}"

CRITERIOS — marcá ok:true si el alumno:
- Captura la idea central aunque sea con sus propias palabras
- Usa sinónimos o reformulaciones válidas
- Tiene la dirección correcta aunque le falten detalles menores
- Comete errores menores de terminología pero entiende el concepto

Marcá ok:false SOLO si:
- La respuesta es completamente incorrecta o contradice el concepto
- Muestra confusión conceptual clara (no solo imprecisión de vocabulario)
- Es demasiado vaga para evaluar ("no sé", "algo relacionado con células", etc.)

JSON SOLO sin markdown: {"ok":true} o {"ok":false}`;
  try{
    const r=parseJ(await ai(p));
    return r.ok===true;
  }catch{
    // Si falla el parse, dar el beneficio de la duda si la respuesta es larga
    return txt.trim().length>80;
  }
}

async function evalOpen(q,txt){
  const cov=evalKW(q,txt);
  // Con matching flexible: ≥40% de keywords ya es correcto
  if(cov!==null&&cov>=0.4)return true;
  // Respuesta muy corta sin keywords → incorrecto sin llamar a IA
  if(txt.trim().length<20)return false;
  // Para el resto: la IA decide con criterio generoso
  return await evalOpenAI(q,txt);
}

// ── SOCRÁTICO ─────────────────────────────────────────────────
async function socr(q,hist,ronda){
  const ul=ronda>=3;
  const ht=hist.map(h=>`${h.r==="a"?"ALUMNO":"TUTOR"}: "${h.t}"`).join("\n");
  const p=`Tutor socrático OAB (Curtis 7ma ed.).
Tema: "${q.tmNom}" — Concepto: "${q.conc}"
${ht}
${!ul?`RONDA ${ronda}/3:
- NUNCA digas "incorrecto" ni reveles la respuesta
- Reconocé algo positivo y hacé UNA pregunta guía
- Ronda 1: exploración amplia | Ronda 2: mencioná "${q.conc}" | Ronda 3: muy directa
- Español rioplatense, max 2 oraciones + pregunta`
:`ÚLTIMA — revelá: "${q.resp||q.expl}"
Empezá con "Muy bien por el esfuerzo —". Max 4 oraciones didácticas.`}
JSON: {"t":"...","rev":${ul}}`;
  try{const r=parseJ(await ai(p));return{t:String(r.t||""),rev:!!r.rev};}
  catch{return{t:ul?`Muy bien por el esfuerzo — ${q.expl}`:"¿Podés ampliar tu razonamiento?",rev:ul};}
}

<div style="max-width:86%;padding:10px 13px;border-radius:${m.r==="a"?"16px 16px 4px 16px":"16px 16px 16px 4px"};background:${m.r==="a"?"rgba(37,99,235,.16)":"#131f35"};border:1px solid ${m.r==="a"?"rgba(37,99,235,.28)":"rgba(148,163,184,.1)"};font-size:14px;line-height:1.65;color:${m.r==="a"?"#e2e8f0":"#cbd5e1"};" class="si">${m.t}</div>

  const r=S.ses.res,ok=r.filter(x=>x.ok).length,pct=r.length?Math.round(ok/r.length*100):0;

</div>
<div style="max-width:640px;margin:0 auto;padding:20px 16px 40px;" class="fu">
  <div style="text-align:center;margin-bottom:22px;">
    <div style="font-size:48px;margin-bottom:11px;">${pct>=80?"🏆":pct>=50?"📈":"💪"}</div>
    <div style="font-size:52px;font-weight:800;color:${c};line-height:1;">${pct}%</div>
    <div style="font-size:13px;color:#64748b;margin-top:4px;">${ok}/${r.length} correctas · +${xp} XP</div>

    <div style="flex:1;min-width:0;font-size:12px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${x.tema}</div>
    <div style="font-size:11px;font-weight:600;color:${x.ok?"#22c55e":"#475569"};">${x.ok?"+"+x.xp+" XP":"—"}</div>
  </div>`).join("")}
  </div>
  <div style="display:flex;gap:9px;">
    <button id="bvosel" style="flex:1;padding:13px;background:#131f35;border:1px solid rgba(148,163,184,.15);border-radius:10px;color:#94a3b8;font-size:13px;font-weight:600;">Cambiar temas</button>

</div></div>`;}

// ── EVENTOS ───────────────────────────────────────────────────
function ev(){
  const ipin=document.getElementById("ipin");
  if(ipin){ipin.addEventListener("input",e=>{S.pin=e.target.value.toUpperCase();S.pinErr=false;});ipin.addEventListener("keydown",e=>{if(e.key==="Enter")tryPin();});ipin.focus();}
  document.getElementById("bpin")?.addEventListener("click",tryPin);
  // Login paso 2
  const idni=document.getElementById("idni");
  if(idni){
    idni.addEventListener("input",e=>{S.dni=e.target.value;S.claveErr=false;});
    idni.addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("iclave")?.focus();});
    idni.focus();
  }
  const iclave=document.getElementById("iclave");
  if(iclave){
    iclave.addEventListener("input",e=>{S.clave=e.target.value;S.claveErr=false;});
    iclave.addEventListener("keydown",e=>{if(e.key==="Enter")tryLogin();});
  }
  document.getElementById("blogin")?.addEventListener("click",tryLogin);
  document.getElementById("bvolver")?.addEventListener("click",()=>{S.loginStep=1;S.claveErr=false;render();});
  // Salir desde home
  document.getElementById("bsalir-hdr")?.addEventListener("click",()=>{S.showSalir=true;render();});
  document.getElementById("bsalir-no")?.addEventListener("click",()=>{S.showSalir=false;render();});
  document.getElementById("bsalir-si")?.addEventListener("click",()=>{
    S.showSalir=false;S.pan="pin";S.loginStep=1;S.pin="";S.dni="";S.clave="";render();
  });
  document.getElementById("salir-overlay")?.addEventListener("click",e=>{if(e.target.id==="salir-overlay"){S.showSalir=false;render();}});
  // Abortar sesión
  document.getElementById("babortar")?.addEventListener("click",()=>{
    if(confirm("¿Abandonar la sesión? El progreso de esta sesión no se guardará.")){
      S.ses={plan:[],pregs:[],idx:0,act:{fase:"cargando",ronda:0,hist:[],load:false,sel:null,txt:"",vfs:null},res:[]};
      S.pan="home";render();
    }
  });
  document.getElementById("bsel")?.addEventListener("click",()=>{S.pan="sel";render();});
  document.getElementById("bstart")?.addEventListener("click",()=>{S.showCfg=true;S.pan="sel";render();});
  document.getElementById("bbk")?.addEventListener("click",()=>{S.pan="home";render();});
  document.getElementById("bclr")?.addEventListener("click",()=>{S.sel.clear();saveLocal();render();});
  document.querySelectorAll("[data-uid]").forEach(el=>el.addEventListener("click",()=>{const id=el.dataset.uid;S.exp.has(id)?S.exp.delete(id):S.exp.add(id);render();}));
  document.querySelectorAll("[data-sa]").forEach(el=>el.addEventListener("click",e=>{e.stopPropagation();const u=UNITS.find(u=>u.id===el.dataset.sa);if(!u)return;const all=u.temas.every(t=>S.sel.has(t.id));if(all)u.temas.forEach(t=>S.sel.delete(t.id));else u.temas.forEach(t=>S.sel.add(t.id));saveLocal();render();}));
  document.querySelectorAll("[data-tid]").forEach(el=>el.addEventListener("click",e=>{e.stopPropagation();const id=el.dataset.tid;S.sel.has(id)?S.sel.delete(id):S.sel.add(id);saveLocal();render();}));
  document.getElementById("bircfg")?.addEventListener("click",()=>{S.showCfg=true;render();});
  document.getElementById("cfg-ov")?.addEventListener("click",e=>{if(e.target.id==="cfg-ov"){S.showCfg=false;render();}});
  document.querySelectorAll("[data-n]").forEach(el=>el.addEventListener("click",()=>{S.cfg.n=parseInt(el.dataset.n);render();}));
  document.querySelectorAll("[data-tipo]").forEach(el=>el.addEventListener("click",()=>{const t=el.dataset.tipo;if(t==="mc")return;if(S.cfg.tipos.includes(t))S.cfg.tipos=S.cfg.tipos.filter(x=>x!==t);else S.cfg.tipos.push(t);render();}));
  document.getElementById("binic")?.addEventListener("click",iniciar);
  document.querySelectorAll("[data-mc]").forEach(el=>el.addEventListener("click",()=>{S.ses.act.sel=parseInt(el.dataset.mc);render();}));
  document.querySelectorAll("[data-vfs]").forEach(el=>el.addEventListener("click",()=>{S.ses.act.vfs=(el.dataset.vfs==="true");S.ses.act.txt="";render();setTimeout(()=>document.getElementById("tvf")?.focus(),80);}));
  const tvf=document.getElementById("tvf");
  if(tvf){tvf.addEventListener("input",e=>{S.ses.act.txt=e.target.value;render();});tvf.focus();}
  const to=document.getElementById("topen");
  if(to){to.addEventListener("input",e=>{S.ses.act.txt=e.target.value;const bt=document.getElementById("benv");if(bt)bt.disabled=S.ses.act.txt.trim().length<20;const cc=document.getElementById("cc");if(cc){cc.textContent=S.ses.act.txt.trim().length<20?`Mínimo 20 caracteres`:`${S.ses.act.txt.length} ✓`;cc.style.color=S.ses.act.txt.trim().length<20?"#ef4444":"#475569";}});to.focus();}
  document.getElementById("benv")?.addEventListener("click",enviar);
  document.getElementById("brsp")?.addEventListener("click",respDlg);
  document.getElementById("bnxt")?.addEventListener("click",siguiente);
  // Metacognición — botones de autoevaluación
  document.getElementById("bmeta-ok")?.addEventListener("click",()=>{
    const xp=parseInt(document.getElementById("bmeta-ok")?.dataset.xp||"40");
    const r=S.ses.res[S.ses.res.length-1];if(r){r.meta="completo";r.xp=xp;S.xp+=xp;}
    saveLocal();siguiente();
  });
  document.getElementById("bmeta-parcial")?.addEventListener("click",()=>{
    const xp=parseInt(document.getElementById("bmeta-parcial")?.dataset.xp||"24");
    const r=S.ses.res[S.ses.res.length-1];if(r){r.meta="parcial";r.xp=xp;S.xp+=xp;}
    saveLocal();siguiente();
  });
  document.getElementById("bmeta-no")?.addEventListener("click",()=>{
    const r=S.ses.res[S.ses.res.length-1];if(r){r.meta="no";r.xp=5;S.xp+=5;}
    saveLocal();siguiente();
  });
  document.getElementById("bvosel")?.addEventListener("click",()=>{S.pan="sel";render();});
  document.getElementById("bnueva")?.addEventListener("click",iniciar);
}

// ── LÓGICA ────────────────────────────────────────────────────
function tryPin(){
  if(S.pin===PIN){
    S.pinErr=false;
    // Si ya tiene DNI guardado, ir directo al paso 2
    S.loginStep=2;render();
    setTimeout(()=>document.getElementById("idni")?.focus(),100);
  }else{S.pinErr=true;render();}
}

function tryLogin(){
  const dni=document.getElementById("idni")?.value?.trim()||"";
  const clave=document.getElementById("iclave")?.value?.trim()||"";
  if(!dni||dni.length<6){S.claveErr=true;render();return;}
  if(clave!==CLAVE_ALUMNO){S.claveErr=true;render();return;}
  S.dni=dni;S.nombre=dni;S.clave=clave;S.claveErr=false;
  S.pan="home";saveLocal();render();
}

async function iniciar(){
  S.showCfg=false;
  const temas=[...S.sel].map(id=>tById(id)).filter(Boolean);
  if(!temas.length)return;
  const tipos=S.cfg.tipos.length?S.cfg.tipos:["mc"];
  const plan=[];
  for(let i=0;i<S.cfg.n;i++)plan.push({tema:temas[i%temas.length],tipo:tipos[i%tipos.length]});
  for(let i=plan.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[plan[i],plan[j]]=[plan[j],plan[i]];}
  S.ses={plan,pregs:Array(S.cfg.n).fill(null),idx:0,act:{fase:"cargando",ronda:0,hist:[],load:false,sel:null,txt:"",vfs:null},res:[]};
  S.pan="ses";render();
  const q=await genQ(plan[0].tema,plan[0].tipo);
  S.ses.pregs[0]=q;S.ses.act.fase="res";render();
  if(plan.length>1)genQ(plan[1].tema,plan[1].tipo).then(q2=>{S.ses.pregs[1]=q2;});
}

async function enviar(){
  const ac=S.ses.act,q=S.ses.pregs[S.ses.idx];if(!q)return;
  if(q.tipo==="mc"){
    if(evalMC(q,ac.sel)){fin(q,true,40);return;}
    ac.ronda++;ac.hist.push({r:"a",t:`Elegí: "${(q.ops[ac.sel]||"").replace(/^[A-D]\)\s*/,"").substring(0,60)}"`});
    ac.fase="dlg";ac.load=true;render();
    const rs=await socr(q,ac.hist,ac.ronda);
    ac.load=false;ac.hist.push({r:"t",t:rs.t});
    if(rs.rev)fin(q,false,8);render();return;
  }
  if(q.tipo==="vf"){
    if(evalVF(q,ac.vfs)){fin(q,true,35);return;}
    ac.ronda++;ac.hist.push({r:"a",t:`${ac.vfs?"Verdadero":"Falso"} — ${ac.txt.substring(0,60)}`});
    ac.fase="dlg";ac.load=true;render();
    const rs=await socr(q,ac.hist,ac.ronda);
    ac.load=false;ac.hist.push({r:"t",t:rs.t});
    if(rs.rev)fin(q,false,8);render();return;
  }
  if(q.tipo==="open"){
    ac.load=true;render();
    const ok=await evalOpen(q,ac.txt);
    if(ok){fin(q,true,50);return;}
    ac.ronda++;ac.hist.push({r:"a",t:ac.txt.substring(0,120)});
    ac.fase="dlg";ac.load=true;render();
    const rs=await socr(q,ac.hist,ac.ronda);
    ac.load=false;ac.hist.push({r:"t",t:rs.t});
    if(rs.rev)fin(q,false,8);render();
  }
}

async function respDlg(){
  const td=document.getElementById("tdlg");if(!td||!td.value.trim())return;
  const ac=S.ses.act,q=S.ses.pregs[S.ses.idx],resp=td.value.trim();
  ac.hist.push({r:"a",t:resp});ac.load=true;render();
  let ok=false;
  if(q.tipo==="open")ok=await evalOpen(q,resp);
  else ok=await evalOpenAI({conc:q.conc,resp:q.expl},resp);
  if(ok){fin(q,true,Math.round((q.tipo==="open"?50:40)*0.72));return;}
  ac.ronda++;
  if(ac.ronda>3){fin(q,false,8);return;}
  const rs=await socr(q,ac.hist,ac.ronda);
  ac.load=false;ac.hist.push({r:"t",t:rs.t});
  if(rs.rev)fin(q,false,8);render();
}

function fin(q,ok,xp,meta){
  // meta: "completo"|"parcial"|"no" — viene de la pantalla de metacognición
  const xpFinal=ok?xp:8;
  S.ses.res.push({
    ok,xp:xpFinal,tema:q.tmNom,tipo:q.tipo,
    meta:meta||"",rondas:S.ses.act.ronda
  });
  S.ses.act.fase=ok?"ok":"rev";
  S.xp+=xpFinal;saveLocal();render();
}

async function siguiente(){
  const ni=S.ses.idx+1;
  if(ni>=S.cfg.n){
    S.sesiones++;S.racha++;saveLocal();
    // Guardar en Sheets en background (no bloquear UI)
    guardarEnSheets(S.ses.res);
    S.pan="fin";render();return;
  }
  S.ses.idx=ni;S.ses.act={fase:"cargando",ronda:0,hist:[],load:false,sel:null,txt:"",vfs:null};render();
  if(!S.ses.pregs[ni]){const p=S.ses.plan[ni];S.ses.pregs[ni]=await genQ(p.tema,p.tipo);}
  S.ses.act.fase="res";render();
  if(ni+1<S.ses.plan.length&&!S.ses.pregs[ni+1])genQ(S.ses.plan[ni+1].tema,S.ses.plan[ni+1].tipo).then(q=>{S.ses.pregs[ni+1]=q;});
}

// ── INIT ──────────────────────────────────────────────────────
loadLocal();render();
</script>
